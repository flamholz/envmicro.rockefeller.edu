# site properties and page defaults
title: Laboratory of Environmental Microbiology
subtitle: Flamholz Lab · The Rockefeller University
description: We study and engineer the roles of microbes in the global carbon cycle, from CO₂-eating autotrophs to the collective respiration of microbial communities.
header: images/gallery/millbrook-lab-trip.jpg
footer: images/gallery/millbrook-lab-trip.jpg
# html-proofer runs as a separate step (scripts/check-links.sh), not on every build
proofer: false

# where the compiled site is served (Apache, not GitHub Pages)
url: "https://envmicro.rockefeller.edu"
baseurl: ""

# lab contact details (shown in the footer and on the Join page)
contact:
  name: Avi Flamholz
  address:
    - The Rockefeller University
    - 1230 York Ave
    - New York, NY 10065
  phone: 212-327-0000
  phone-link: "+1-212-327-0000"

# site social media and other links (icons in the footer)
# (no email here on purpose, to keep it out of every page's footer)
links:
  google-scholar: A7RolPoAAAAJ
  orcid: 0000-0002-9278-5479
  github: flamholz

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# news posts live under /news/
permalink: /news/:year/:month/:day/:title/

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts
  - .htaccess

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE
  - LICENSE.md
  - MIGRATION_NOTES.md
  - requirements.txt
  - scripts/
  - .venv/
  - .docker/
  - .github/
  - vendor/
  - .ruby-version
  - .python-version

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
