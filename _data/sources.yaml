# Papers shown on the Research page.
# Add a paper by its DOI, then run scripts/build.sh (or `python _cite/cite.py`)
# to regenerate _data/citations.yaml.
#
# `image:` is the thumbnail shown beside the paper: one panel cropped from a
# figure in the paper (images/publications/, ~600px, author-year-topic.jpg).
#
# `title:` overrides the title from Crossref where it has stray markup or line
# breaks (e.g. <sub>2</sub>); write CO₂ / O₂ with Unicode subscripts.
#
# The research page shows one list per topic tag:
#   metabolism    -> Microbial metabolism, physiology & communities
#   co2-fixation  -> Microbial CO2 fixation & rubisco
#   environment   -> Environmental analysis
#   earlier       -> Earlier contributions

