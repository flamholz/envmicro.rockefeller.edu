# Papers shown on the Publications page.
# Add a paper by its DOI, then run scripts/build.sh (or `python _cite/cite.py`)
# to regenerate _data/citations.yaml.
#
# Optional fields per paper (any field here overrides what Crossref returns):
#
# `image:` the square thumbnail beside the paper: one panel cropped from a
#   figure (images/publications/, ~600px, author-year-topic.jpg).
# `title:` overrides the title from Crossref where it has stray markup or line
#   breaks (e.g. <sub>2</sub>); write CO₂ / O₂ with Unicode subscripts.
# Write-ups: a paper with a file in _papers/ (matched by `doi:`) gets its own
#   page at /publications/<file name>/, and its title and thumbnail on the
#   Publications list link there. See _papers/ for the format.
#
# The Publications page shows one list per tag (each list is newest first):
#   recent      -> Recent papers
#   commentary  -> Commentary and framing
#   other       -> Other contributions

