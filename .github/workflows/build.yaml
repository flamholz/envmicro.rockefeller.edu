name: build
run-name: Build site (${{ github.ref_name }})

# Builds the static site and uploads _site/ as a downloadable artifact.
# There is intentionally no deploy step: see "Deployment (TBD)" in
# MIGRATION_NOTES.md.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # full history so jekyll-last-modified-at gets real dates
          fetch-depth: 0

      - name: Set up Ruby (version from .ruby-version, gems from Gemfile.lock)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build site (citations + Jekyll)
        run: scripts/build.sh

      - name: Check internal links
        run: scripts/check-links.sh

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.ref_name == 'main' && 'main' || github.sha }}
          path: _site/
          # keep .htaccess
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
